global:
  resolve_timeout: 5m

route:
  receiver: "flask-alert-log"
  group_by: ["alertname", "layer", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m
  routes:
    - matchers:
        - severity="critical"
      receiver: "flask-critical-alert-log"
      repeat_interval: 10m

receivers:
  - name: "flask-alert-log"
    webhook_configs:
      - url: "https://titanic-app-production.up.railway.app/api/observability/alerts"
        send_resolved: true

  - name: "flask-critical-alert-log"
    webhook_configs:
      - url: "https://titanic-app-production.up.railway.app/api/observability/alerts"
        send_resolved: true